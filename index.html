<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">

<title>今天喝什么 · 12 个问题帮你挑一杯不会买错的</title>
<meta name="description" content="12 个生活化的小问题，帮你判断今天该喝哪一类酒。只给到「产区 + 风格」，不讲术语、不推牌子、不出现酒庄。不懂酒也没关系，来测测你就知道。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="今天喝什么">
<meta property="og:title" content="今天喝什么 · 12 个问题帮你挑一杯不会买错的">
<meta property="og:description" content="12 个生活化的小问题，帮你判断今天该喝哪一类酒。不讲术语、不推牌子，不懂酒也没关系。">
<meta property="og:url" content="https://zhaolynn007.github.io/what-to-drink-today/">
<meta property="og:image" content="https://zhaolynn007.github.io/what-to-drink-today/cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://zhaolynn007.github.io/what-to-drink-today/cover.png">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%237B2430'/%3E%3Ctext%20x='16'%20y='23'%20font-size='17'%20text-anchor='middle'%20fill='%23E9C9A8'%20font-family='serif'%3E酒%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F4EE; --card:#FFFDFA; --ink:#241C18; --ink2:#6E635B; --ink3:#9C9188;
  --line:#E6DED3; --wine:#7B2430; --wine-d:#4A121D; --gold:#A8834E;
  --paper:#FDFAF3; --paperline:#EADDC6;
}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.68;
  -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center;
  padding:0 20px 72px;
}
.serif{font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"SimSun",serif}
.wrap{width:100%;max-width:720px;padding-top:48px}

.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:36px}
.bar i{display:block;height:100%;width:0;border-radius:3px;
  background:linear-gradient(90deg,var(--wine),var(--gold));
  transition:width .5s cubic-bezier(.4,0,.2,1)}

.fade{opacity:0;transform:translateY(10px);transition:opacity .4s ease,transform .4s cubic-bezier(.2,.8,.3,1)}
.fade.in{opacity:1;transform:none}

/* ---------- 结果浮层：浮在"三个推荐"上面 ---------- */
.ovl{position:fixed;inset:0;z-index:80;display:none}
.ovl.on{display:block}
.ovl-bg{position:absolute;inset:0;background:rgba(32,16,20,.52);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ovl-panel{
  position:absolute;left:50%;top:50%;width:min(94vw,660px);max-height:90vh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translate(-50%,-50%);
  background:var(--bg);border-radius:22px;padding:26px 22px 30px;
  box-shadow:0 34px 90px rgba(20,8,12,.5);
  animation:rise .44s cubic-bezier(.2,1.06,.3,1) both;
}
/* "上浮"：从下方一点浮上来，带轻微过冲 */
@keyframes rise{
  from{opacity:0;transform:translate(-50%,-44%) scale(.955)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.ovl-hint{margin-top:22px;text-align:center;font-size:12.5px;color:var(--ink3);line-height:1.75}
.ovl-hint b{color:var(--wine);font-weight:600}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);z-index:120;
  max-width:86vw;background:rgba(36,20,24,.93);color:#fff;font-size:13px;line-height:1.5;
  padding:11px 20px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.32);
  transition:opacity .4s ease;opacity:1}
.toast.out{opacity:0}
@media (prefers-reduced-motion:reduce){ .ovl-panel{animation:none} }
/* 多选题：圆点换成方框 + 勾 */
.opts.multi .dot{border-radius:6px}
.opts.multi .opt.sel .dot{border-radius:6px;border-color:var(--wine);background:var(--wine)}
.opts.multi .opt.sel .dot::after{
  content:"";width:10px;height:5px;border-radius:0;background:none;
  border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg) translate(1px,-2px);
}
.qhint.multi{color:var(--wine);margin-bottom:16px}
.multibar{margin-top:22px}
.multibar button.go{width:100%}

/* ---------- 首页 ---------- */
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--gold);margin-bottom:16px}
h1{font-size:38px;line-height:1.28;font-weight:600;margin-bottom:18px}
h1 em{font-style:normal;color:var(--wine)}
.lede{color:var(--ink2);font-size:16.5px;margin-bottom:32px}
.lede b{color:var(--ink);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:26px}
.panel h3{font-size:13px;letter-spacing:.1em;color:var(--ink3);font-weight:500;margin-bottom:14px}
.panel ul{list-style:none}
.panel li{position:relative;padding-left:18px;margin-bottom:9px;color:var(--ink2);font-size:14.5px}
.panel li::before{content:"";position:absolute;left:0;top:10px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.panel li:last-child{margin-bottom:0}

button.go{
  appearance:none;border:0;cursor:pointer;font:inherit;
  background:var(--wine);color:#fff;border-radius:999px;padding:15px 44px;
  font-size:16px;letter-spacing:.04em;
  box-shadow:0 8px 24px rgba(123,36,48,.22);transition:.25s;
}
button.go:hover{background:var(--wine-d);transform:translateY(-2px);box-shadow:0 12px 30px rgba(123,36,48,.3)}
button.go:active{transform:translateY(0)}

/* ---------- 题目 ---------- */
.qnum{font-size:12px;letter-spacing:.2em;color:var(--gold);margin-bottom:14px}
.qnum b{font-size:15px;color:var(--wine);font-weight:600}
.qtitle{font-size:26px;line-height:1.42;font-weight:600;margin-bottom:8px}
.qhint{color:var(--ink3);font-size:13.5px;margin-bottom:26px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 20px;cursor:pointer;display:flex;gap:15px;align-items:flex-start;
  transition:.2s ease;
}
.opt:hover{border-color:var(--wine);transform:translateX(5px);box-shadow:0 6px 22px rgba(123,36,48,.09)}
.opt.sel{border-color:var(--wine);background:#FCF6F5}
.dot{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;
  display:flex;align-items:center;justify-content:center;transition:.2s}
.opt:hover .dot{border-color:var(--wine)}
.opt.sel .dot{border-color:var(--wine);background:var(--wine)}
.opt.sel .dot::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.olabel{font-size:16.5px;font-weight:500;margin-bottom:2px}
.odesc{font-size:13.5px;color:var(--ink2);line-height:1.55}
.back{margin-top:24px;font-size:13px;color:var(--ink3);cursor:pointer;display:inline-block;user-select:none}
.back:hover{color:var(--wine)}
.backwrap{text-align:center;margin-top:22px}
.backwrap .back{margin-top:0}

/* ---------- 结果：黄历日期卡 ---------- */
.almanac{
  background:var(--paper);border:1px solid var(--paperline);border-radius:16px;
  padding:26px 28px 24px;margin-bottom:22px;position:relative;overflow:hidden;
}
.almanac::after{
  content:"";position:absolute;inset:7px;border:1px solid rgba(168,131,78,.28);
  border-radius:11px;pointer-events:none;
}
.al-date{font-size:27px;font-weight:600;line-height:1.3}
.al-week{font-size:13px;color:var(--ink3);margin-top:5px;letter-spacing:.06em}
.al-lunar{font-size:15px;color:var(--wine);margin-top:12px;padding-top:12px;border-top:1px dashed var(--paperline);letter-spacing:.04em}
.al-lunar span{color:var(--ink2);font-size:13.5px}
.yiji{margin-top:18px;padding-top:16px;border-top:1px dashed var(--paperline);display:flex;flex-direction:column;gap:10px}
.yi-row{display:flex;align-items:flex-start;gap:12px}
.stamp{
  flex:0 0 auto;width:26px;height:26px;border-radius:6px;background:var(--wine);color:#fff;
  font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:600;margin-top:2px;
}
.stamp.gray{background:#B9AFA4}
.yi-text{font-size:16px;color:var(--ink);letter-spacing:.06em;padding-top:1px}
.yi-text em{font-style:normal;color:var(--wine)}
.ji-text{font-size:15px;color:var(--ink2);letter-spacing:.06em;padding-top:1px}

/* ---------- 结果：主推荐 ---------- */
.hero{
  background:linear-gradient(150deg,#3E0F18 0%,#6E1F2A 55%,#8A3A33 100%);
  color:#fff;border-radius:18px;padding:30px 32px;margin-bottom:14px;
  box-shadow:0 18px 44px rgba(62,15,24,.26);
}
.hero.soft{background:linear-gradient(150deg,#3B2A12 0%,#6E4A20 55%,#8B6A33 100%);box-shadow:0 18px 44px rgba(59,42,18,.24)}
.hero .flag{display:inline-block;font-size:11.5px;letter-spacing:.14em;
  background:rgba(255,255,255,.15);border-radius:999px;padding:5px 13px;margin-bottom:15px}
.hero h2{font-size:31px;font-weight:600;line-height:1.3;margin-bottom:7px}
.hero .meta{font-size:13px;color:rgba(255,255,255,.62);margin-bottom:20px}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tag{font-size:13px;color:#2A1A12;background:#EFE3D2;border-radius:999px;padding:6px 14px}
.hero .tag{background:rgba(255,255,255,.16);color:#fff}
.taste{font-size:15px;line-height:1.85;color:rgba(255,255,255,.9);padding-top:18px;border-top:1px solid rgba(255,255,255,.15)}
.taste .lbl{display:block;font-size:12px;letter-spacing:.14em;color:#E9C9A8;margin-bottom:9px}
.why{list-style:none;margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.15)}
.why li{position:relative;padding-left:17px;font-size:14.5px;color:rgba(255,255,255,.88);margin-bottom:8px;line-height:1.62}
.why li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:#E9C9A8}
.why li:last-child{margin-bottom:0}

/* ---------- 红卡右下角的两个二维码 ---------- */
.qrrow{display:flex;justify-content:flex-end;gap:14px;margin-top:24px;
  padding-top:18px;border-top:1px solid rgba(255,255,255,.15)}
.qrtile{background:#fff;border-radius:12px;padding:7px 7px 5px;text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,.2)}
.qrtile img{display:block;width:76px;height:76px;border-radius:4px}
.qrtile span{display:block;font-size:10.5px;color:#7B2430;margin-top:4px;
  letter-spacing:.06em;font-weight:500}
/* 长按手势是页面自己的功能：别让系统弹文字选择/放大镜打断。
   二维码那枚图要单独放开，留着系统"识别图中二维码/保存图片"的菜单 */
.hero{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.qrtile img{-webkit-touch-callout:default}

/* ---------- 长按红卡后的全屏预览层 ---------- */
.pvl{position:fixed;inset:0;z-index:130;background:rgba(20,10,12,.82);display:none;
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.pvl.on{display:block}
.pvl-i{min-height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:34px 22px;box-sizing:border-box}
.pvl-i img{display:block;width:min(86vw,420px);border-radius:14px;
  box-shadow:0 18px 48px rgba(0,0,0,.5)}
.pvl-t{margin-top:16px;text-align:center;color:#fff;font-size:13.5px;line-height:1.85}
.pvl-t b{color:#F3DEC7}
.pvl-t span{color:rgba(255,255,255,.62);font-size:12px}
.pvl-acts{display:flex;justify-content:center;gap:40px;margin-top:26px}
.pvl-tip{display:none;max-width:86vw;margin-top:18px;padding:11px 18px;border-radius:999px;
  background:rgba(255,255,255,.14);border:1px solid rgba(243,222,199,.38);
  color:#F7E6D2;font-size:13.5px;line-height:1.7;text-align:center}
.pvl-tip.on{display:block}
.pvl-act{display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer}
.pvl-act i{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,.28);transition:transform .12s}
.pvl-act:active i{transform:scale(.92)}
.pvl-act span{color:#fff;font-size:13px}
.pvl-cancel{margin-top:22px;text-align:center;color:rgba(255,255,255,.85);
  font-size:15px;padding:12px;cursor:pointer}

/* 二次确认小卡 */
.pvl-cfm{position:absolute;inset:0;display:none;background:rgba(20,10,12,.45);z-index:5}
.pvl-cfm.on{display:block}
.pvl-cfm-i{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
  width:min(78vw,340px);background:#FFFDF9;border-radius:16px;padding:22px 20px 18px;
  box-shadow:0 18px 44px rgba(0,0,0,.4);text-align:center}
.pvl-cfm-t{font-size:14.5px;color:#3B2B25;line-height:1.7}
.pvl-cfm-b{display:flex;gap:12px;margin-top:18px}
.pvl-cfm-b button{flex:1;border:0;border-radius:999px;padding:11px 0;font-size:14.5px;cursor:pointer}
.pvl-no{background:#F1EAE0;color:#6B5340}
.pvl-ok{background:#7B2430;color:#fff;font-weight:600}

/* ---------- 右上角的转发按钮 ---------- */
.fab{position:fixed;top:14px;right:14px;z-index:90;display:flex;align-items:center;gap:6px;
  background:rgba(255,253,250,.94);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;font-size:13.5px;color:var(--wine);font-weight:500;
  box-shadow:0 6px 18px rgba(36,28,24,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.fab:active{transform:scale(.96)}
.fab svg{display:block}

/* ---------- 微信里「点右上角」的引导层 ---------- */
.wxg{position:fixed;inset:0;z-index:120;background:rgba(20,10,12,.62);display:none}
.wxg.on{display:block}
.wxg-i{position:absolute;top:12px;right:16px;text-align:right;color:#fff}
.wxg-i svg{display:block;margin-left:auto}
.wxg-i .t{display:block;font-size:14.5px;line-height:1.75;margin-top:8px;
  background:rgba(0,0,0,.5);border-radius:12px;padding:11px 15px;text-align:left;max-width:78vw}
.wxg-i .t b{color:#F3DEC7}

.block{margin-top:30px}
.block h3{font-size:13px;letter-spacing:.14em;color:var(--ink3);font-weight:500;margin-bottom:14px}
.warn{background:#FDF8F3;border:1px solid #F0E3D4;border-radius:14px;padding:20px 22px}
.warn ul{list-style:none}
.warn li{position:relative;padding-left:20px;font-size:14px;color:#6B5340;margin-bottom:10px;line-height:1.62}
.warn li::before{content:"—";position:absolute;left:0;color:var(--gold)}
.warn li:last-child{margin-bottom:0}
.note{font-size:14.5px;color:var(--ink2);line-height:1.8}
.note b{color:var(--ink);font-weight:600}
.footer{margin-top:42px;padding-top:20px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink3);line-height:1.7}
.again{margin-top:30px}

/* ---------- 首页承诺句 ---------- */
.promise{font-size:19px;color:var(--wine);letter-spacing:.1em;font-weight:500;text-align:center;padding:8px 0 4px}

/* ---------- 三个候选卡 ---------- */
.picknote{font-size:13.5px;color:var(--ink3);margin-bottom:20px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:26px 26px 22px;margin-bottom:16px;cursor:pointer;transition:.22s;position:relative;
}
.card:hover{border-color:var(--wine);transform:translateY(-3px);box-shadow:0 14px 34px rgba(123,36,48,.13)}
.card.best{border-color:#DCC3A6;background:linear-gradient(180deg,#FFFCF7,#FFFDFA)}
.badge{
  position:absolute;top:-11px;left:24px;background:var(--wine);color:#fff;
  font-size:11.5px;letter-spacing:.1em;border-radius:999px;padding:4px 13px;
}
.card h3{font-size:24px;font-weight:600;margin-bottom:5px}
.card .meta{font-size:13px;color:var(--ink3);margin-bottom:15px}
.card .desc{font-size:14.5px;color:var(--ink2);line-height:1.75;margin-bottom:12px;
  padding-left:14px;border-left:2px solid var(--line)}
.card .kw{font-size:13.5px;color:var(--ink2);margin-bottom:14px}
.card .wholine{font-size:13.5px;color:var(--ink2);line-height:1.7;margin-bottom:16px}
.card .pick{
  font-size:14.5px;color:var(--wine);font-weight:500;letter-spacing:.06em;
  padding-top:15px;border-top:1px dashed var(--line);
}
.card:hover .pick{color:var(--wine-d)}

/* ---------- 保存与分享 ---------- */
.acts{display:flex;flex-wrap:wrap;gap:11px}
button.ghost{
  appearance:none;cursor:pointer;font:inherit;background:#fff;color:var(--wine);
  border:1px solid #E2D2C9;border-radius:999px;padding:14px 30px;font-size:15px;transition:.2s;
}
button.ghost:hover{background:#FCF6F5;border-color:var(--wine)}
button.ghost:disabled{opacity:.55;cursor:default}
.sharewrap{margin-top:22px;text-align:center}
.sharewrap img{width:100%;max-width:330px;border-radius:14px;box-shadow:0 14px 36px rgba(62,15,24,.22)}
.sharetip{font-size:13px;color:var(--ink3);margin-top:14px;line-height:1.75}
/* 分享链接 + 二维码 */
.sharerow{margin-top:18px;display:flex;gap:15px;align-items:flex-start;background:var(--paper);border:1px solid var(--paperline);border-radius:14px;padding:15px}
.sharerow img.qr{width:96px;height:96px;flex:0 0 auto;background:#fff;border-radius:9px;padding:5px;border:1px solid var(--line);display:block}
.sharerow .sr{min-width:0;flex:1}
.sharerow .srt{font-size:14px;font-weight:500;color:var(--ink);line-height:1.5;margin-bottom:7px}
.sharerow .sru{font-size:11.5px;color:#8A7A6D;word-break:break-all;line-height:1.5;margin-bottom:10px;font-family:ui-monospace,Menlo,Consolas,monospace}
.sharerow .srn{font-size:12.5px;color:var(--ink2);line-height:1.68;margin-top:10px}
.sharerow button.ghost{padding:9px 20px;font-size:13px}
@media (max-width:600px){
  .sharerow{gap:13px;padding:14px}
  .sharerow img.qr{width:84px;height:84px}
}
.mapt-inline{color:var(--wine)}

@media (max-width:600px){
  .wrap{padding-top:32px}
  h1{font-size:29px}
  .qtitle{font-size:21px}
  .al-date{font-size:22px}
  .hero{padding:24px 22px}
  .hero h2{font-size:25px}
  .panel{padding:20px 18px}
  .almanac{padding:22px 20px 20px}
}
</style>
</head>
<body>
<!-- 微信「转发给朋友」的卡片缩略图：微信会抓页面里靠前的、够大的一张图来当小方块，
     所以把 og:image 用的这张 cover.png 放在最前面（对用户不可见）。 -->
<img src="https://zhaolynn007.github.io/what-to-drink-today/cover.png" alt="" style="position:absolute;left:-9999px;top:0;width:300px;height:300px">
<div class="wrap">
  <div class="bar"><i id="bar"></i></div>
  <div id="view"></div>
</div>

<!-- 右上角的转发按钮：手机上唤起系统分享，微信里引导去点右上角的 ··· -->
<div class="fab" id="fab" role="button" aria-label="转发给朋友">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7B2430" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13"/><path d="M7 8l5-5 5 5"/>
  </svg>转发

function leapMonth(y){ return LUNAR_INFO[y - 1900] & 0xf; }
function leapDays(y){
  if(!leapMonth(y)) return 0;
  return (LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29;
}
function monthDays(y, m){ return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
function lunarYearDays(y){
  var sum = 348;
  for(var i = 0x8000; i > 0x8; i >>= 1){ sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0; }
  return sum + leapDays(y);
}
function solarToLunar(d){
  var offset = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - LUNAR_BASE) / 86400000);
  var temp = 0, y;
  for(y = 1900; y < 2101 && offset > 0; y++){
    temp = lunarYearDays(y);
    offset -= temp;
  }
  if(offset < 0){ offset += temp; y--; }
  var year = y, leap = leapMonth(year), isLeap = false, m;
  for(m = 1; m < 13 && offset > 0; m++){
    if(leap > 0 && m === leap + 1 && !isLeap){
      --m; isLeap = true; temp = leapDays(year);
    } else {
      temp = monthDays(year, m);
    }
    if(isLeap && m === leap + 1) isLeap = false;
    offset -= temp;
  }
  if(offset === 0 && leap > 0 && m === leap + 1){
    if(isLeap){ isLeap = false; } else { isLeap = true; --m; }
  }
  if(offset < 0){ offset += temp; --m; }
  return {year: year, month: m, day: offset + 1, isLeap: isLeap};
}

var answers = [];

var STEP_RESULT = NQ + 2;        // 选定结果

var DIMS = [['body',14],['tannin',12],['acid',11],['sweet',12],['fruit',9],['oak',7]];
var DIM_MAX = DIMS.reduce(function(a,d){ return a + d[1]; }, 0);
var TOTAL_MAX = 100 + 28 + 12 + 16 + 14;   // 170

function buildProfile(){
  var u = {body:3, tannin:3, acid:3, sweet:1, fruit:3, oak:2,
           price:2, scene:'friends', food:'none', type:'any', types:[],
           abv:'mid', age:'adult', stype:'any', stypes:[]};
  var acc = {}, cnt = {};
  var typeVals = [], stypeVals = [];
  answers.forEach(function(ai, qi){
    var q = QUESTIONS[qi];
    if(!q) return;
    // 多选题存的是下标数组，单选题存的是单个下标
    var list = Array.isArray(ai) ? ai : [ai];
    // 注意：第 2 题选了「0 酒精」时，类型题展示的是饮品版本的那一组选项，
    // 下标必须对着「实际看到的那一组」去取，不能一律读 q.opts，否则会取成牛头不对马嘴的选项。
    var pool = shownOpts(qi);
    list.forEach(function(k){
      var o = pool[k];
      if(!o) return;
      Object.keys(o.fx).forEach(function(key){
        var v = o.fx[key];
        if(key === 'type'){ typeVals.push(v); }
        else if(key === 'stype'){ stypeVals.push(v); }
        else if(key === 'scene' || key === 'food' || key === 'price'
                || key === 'abv' || key === 'age'){ u[key] = v; }
        else { acc[key] = (acc[key] || 0) + v; cnt[key] = (cnt[key] || 0) + 1; }
      });
    });
  });
  Object.keys(acc).forEach(function(k){ u[k] = acc[k] / cnt[k]; });

  // 类型题可以多选：取并集。点了「都行」、或者一个都没点，就是不设限。
  u.types = uniq(typeVals);
  if(u.types.indexOf('any') >= 0) u.types = [];
  u.type = u.types.length === 0 ? 'any' : (u.types.length === 1 ? u.types[0] : 'multi');

  u.stypes = uniq(stypeVals);
  if(u.stypes.indexOf('any') >= 0) u.stypes = [];
  u.stype = u.stypes.length === 0 ? 'any' : (u.stypes.length === 1 ? u.stypes[0] : 'multi');

  // 最后那道类型题是最明确的一次表态，跟前面的口味冲突时以它为准
  if(u.types.indexOf('sweet') >= 0) u.sweet = Math.max(u.sweet, 3.8);
  return u;
}
// 去重，不改原数组
function uniq(arr){
  var out = [];
  arr.forEach(function(x){ if(out.indexOf(x) < 0) out.push(x); });
  return out;
}

// 走无酒精线：明确说 0 酒精，或者未满 18 岁
function isSoft(u){ return u.abv === 'none' || u.age === 'minor'; }

// 按 id 找题号（题目顺序会调整，所以不写死下标）
function qIndex(id){
  for(var i = 0; i < QUESTIONS.length; i++){ if(QUESTIONS[i].id === id) return i; }
  return -1;
}
// 酒精度那一题选了什么；还没答过返回 null
function abvChoice(){
  var i = qIndex('abv');
  if(i < 0 || answers[i] == null) return null;
  var o = QUESTIONS[i].opts[answers[i]];
  return o ? (o.fx.abv || null) : null;
}
// 这一题实际展示的选项（选了 0 酒精时，「想喝哪一种」会整组换成饮品版本）
function shownOpts(qi){
  var q = QUESTIONS[qi];
  if(!q) return [];
  if(q.soft && abvChoice() === 'none') return q.soft.opts;
  return q.opts;
}
// 这个选项是不是「都行，你帮我定」
function isAnyOpt(qi, idx){
  var o = shownOpts(qi)[idx];
  return !!(o && o.fx && (o.fx.type === 'any' || o.fx.stype === 'any'));
}
// 多选题确认按钮的文案
function multiLabel(n){
  return n === 0 ? '都不挑，你帮我定 →' : ('就选这些（已选 ' + n + ' 项）→');
}

// 一个类型是否算命中这瓶酒（想喝甜的，用加强型甜酒兜底也算）
function typeHit(t, w){
  return t === w.t || (t === 'sweet' && w.t === 'fortified' && w.sweet >= 3);
}

function scoreWine(w, u){
  var s = 0;
  DIMS.forEach(function(d){
    s += d[1] * Math.max(0, (5 - Math.abs(u[d[0]] - w[d[0]])) / 5);
  });
  s = s / DIM_MAX * 100;

  // 种类：权重最高，决定推荐范围。多选时命中任意一个就算命中。
  if(u.types.length){
    var ok = u.types.some(function(t){ return typeHit(t, w); });
    s += ok ? 28 : -34;
  }
  // 预算：按"能接受的上限"处理，超了才罚
  s += (w.price <= u.price) ? 12 : -7 * (w.price - u.price);
  // 场合与吃什么：这两项是本次测评的重点
  s += (w.scenes.indexOf(u.scene) >= 0) ? 16 : -4;
  if(u.food !== 'none'){
    if(w.foods.indexOf(u.food) >= 0) s += 14;
    // 配甜点时，干红是最差的组合，罚得比其他不匹配更重
    else s += (u.food === 'dessert') ? -18 : -5;
  }
  // 类型不设限时，小众品类不做默认推荐
  if(!u.types.length && w.odd) s -= 10;
  // 酒精度偏好：没有具体度数数据，用"劲道"（酒体＋单宁，加强酒再抬一档）粗略代理
  if(u.abv === 'low' || u.abv === 'high'){
    var heft = (w.body + w.tannin) / 2 + (w.t === 'fortified' ? 2 : 0);
    var want = (u.abv === 'high') ? 4.4 : 2.2;
    s += Math.max(-6, 6 - Math.abs(heft - want) * 3);
  }
  return s;
}

/* ---------- 无酒精线：甜度／酸度／果香／清爽度才是重点 ---------- */
var SDIMS = [['body',18],['acid',20],['sweet',30],['fruit',26]];
var SDIM_MAX = SDIMS.reduce(function(a,d){ return a + d[1]; }, 0);

function scoreSoft(w, u){
  var s = 0;
  SDIMS.forEach(function(d){
    s += d[1] * Math.max(0, (5 - Math.abs(u[d[0]] - w[d[0]])) / 5);
  });
  s = s / SDIM_MAX * 100;
  // 成人但走了不含酒精线时，「想喝哪一种」问的还是酒的类型，给一点呼应，不硬拗
  if(u.types.indexOf('spark') >= 0 && w.t === 'soft-spark') s += 10;
  if(u.types.indexOf('sweet') >= 0 && w.sweet >= 3.5) s += 10;
  // 明确说了 0 酒精时，「想喝哪一种」问的是饮品，用它来收口（多选时命中任意一类即可）
  if(u.stypes.length){
    var map = {tea:['soft-tea','soft-milk'], juice:['soft-juice'],
               spark:['soft-spark'], cocoa:['soft-cocoa']};
    var hit = u.stypes.some(function(t){ return (map[t] || []).indexOf(w.t) >= 0; });
    s += hit ? 16 : -8;
  }
  s += (w.price <= u.price) ? 12 : -7 * (w.price - u.price);
  s += (w.scenes.indexOf(u.scene) >= 0) ? 16 : -4;
  if(u.food !== 'none'){
    if(w.foods.indexOf(u.food) >= 0) s += 14;
    else s += -6;
  }
  return s;
}

function rank(u){
  var pool = isSoft(u) ? SOFT : WINES;
  return pool.map(function(w){ return {w:w, s: w.soft ? scoreSoft(w, u) : scoreWine(w, u)}; })
             .sort(function(a,b){ return b.s - a.s; });
}

function pickTop(ranked, u){
  var out = [];
  // 多选时先给每种选中的类型各留一个名额：不然选了「红＋甜」会得到三瓶红酒，
  // 跟「给你挑了三个方向」这句话对不上。
  if(u && u.types && u.types.length > 1){
    u.types.forEach(function(t){
      if(out.length >= 3) return;
      for(var pi = 0; pi < ranked.length; pi++){
        var x = ranked[pi];
        if(out.indexOf(x) >= 0 || !typeHit(t, x.w)) continue;
        if(out.some(function(y){ return y.w.fam === x.w.fam; })) continue;
        out.push(x);
        break;
      }
    });
  }
  for(var i = 0; i < ranked.length && out.length < 3; i++){
    if(out.length === 0){ out.push(ranked[i]); continue; }
    if(!out.some(function(x){ return x.w.fam === ranked[i].w.fam; })) out.push(ranked[i]);
  }
  for(var j = 0; j < ranked.length && out.length < 3; j++){
    if(out.indexOf(ranked[j]) < 0) out.push(ranked[j]);
  }
  return out;
}

/* ---------- 把酒的属性翻译成大白话 ---------- */
function plainTags(w){
  if(w.soft) return w.tags.slice();   // 无酒精饮品直接给写好的白话标签
  var t = [];
  t.push(w.body <= 2.4 ? '入口很轻' : (w.body <= 3.8 ? '不轻不重' : '口感厚实'));
  t.push(w.tannin <= 2.0 ? '一点不涩' : (w.tannin <= 3.8 ? '有一点点涩' : '涩感明显'));
  t.push(w.acid <= 3.0 ? '不酸' : (w.acid <= 4.2 ? '清爽微酸' : '酸味明显'));
  t.push(w.sweet <= 0.9 ? '完全不甜' : (w.sweet <= 3.0 ? '微微有点甜' : '是甜的'));
  if(w.fruit >= 4.2) t.push('果香很足');
  else if(w.oak >= 4.0) t.push('有奶油烤香');
  else if(w.fruit <= 2.5) t.push('香味含蓄');
  return t;
}

function tasteText(w){
  if(w.soft) return w.desc;
  var a = [];
  a.push(w.body <= 2.4 ? '喝起来很轻，不压舌头'
       : (w.body <= 3.8 ? '口感不轻不重，正好' : '口感很足，喝一口能感觉到分量'));
  if(w.tannin <= 2.0) a.push('一点都不涩');
  else if(w.tannin >= 4.0) a.push('涩感比较明显，喝完嘴巴会有点发紧');
  else a.push('有一点点涩，但不碍事');
  if(w.acid >= 4.3) a.push('酸酸的，很清爽');
  else if(w.acid <= 2.8) a.push('不怎么酸，很柔和');
  if(w.sweet >= 3.5) a.push('是甜的');
  else if(w.sweet <= 0.9) a.push('不甜');
  else a.push('带一点微甜');
  if(w.fruit >= 4.2) a.push('闻起来果味很冲，像把水果凑到鼻子前');
  else if(w.oak >= 4.0) a.push('有奶油、烤面包、香草那种香味');
  else if(w.fruit <= 2.5) a.push('香味含蓄，像花香、香料，还有雨后石头的味道');
  else a.push('香味不浓不淡，果味和别的味道混在一起');
  return a.join('，') + '。';
}

function whyLines(w, u){
  if(w.soft) return whyLinesSoft(w, u);
  var out = [];
  var al = ALMANAC[u.scene] || ALMANAC.friends;
  out.push(al.say + '。');

  if(u.food === 'none'){
    out.push('不配吃的更好，这瓶单喝就有味道。');
  } else if(w.foods.indexOf(u.food) >= 0){
    out.push('它跟你要配的' + foodName(u.food) + '是一路的，不会互相打架。');
  }

  if(u.tannin <= 2.2 && w.tannin <= 2.2) out.push('你说了怕涩，它正好不涩。');
  else if(u.tannin >= 4.0 && w.tannin >= 4.0) out.push('你能接受那股涩劲，它给得起。');
  if(u.acid <= 2.3 && w.acid <= 3.2) out.push('你说不喜欢酸，它不酸。');
  else if(u.acid >= 4.3 && w.acid >= 4.3) out.push('你要的酸爽它有。');
  if(u.sweet >= 3.5 && w.sweet >= 3.5) out.push('你想喝甜的，它就是甜的。');
  else if(u.sweet <= 0.9 && w.sweet <= 0.9) out.push('你不吃甜，它是完全不甜的。');
  if(u.body >= 4.2 && w.body >= 4.3) out.push('你要有味道、有分量的，它够。');
  else if(u.body <= 2.3 && w.body <= 2.4) out.push('你要轻的，它入口几乎没有负担。');

  return out.slice(0, 4);
}

/* ---------- 无酒精线的推荐理由（场合话术里不能出现"产区""这瓶酒"） ---------- */

    cheese:'配奶酪火腿这类，两个味道会互相抬一把。',

    outdoor:'露营野餐不方便讲究，它不挑温度，开盖就能喝。',
    afternoon:'一个人待着的时候，它不吵不闹，慢慢喝正好。',
    friends:'朋友聚会要的是好入口、能聊下去，它不会让人拘着。',
    family:'一家人吃饭口味杂，它是最不容易出错的那种。',
    gift:'送人或者正式场合，不含酒精反而更稳妥，谁都能喝。',
    date:'两个人的时候，它不冲，慢慢聊正好。'

  var out = [];
  out.push(sceneSay[u.scene] || '按你选的场合，它是最不容易出错的那一杯。');

    out.push('它跟你要配的' + foodName(u.food) + '是一路的，不会互相打架。');
  }
  if(u.acid <= 2.3 && w.acid <= 3.2) out.push('你说不喜欢酸的，它不酸。');
  else if(u.acid >= 4.3 && w.acid >= 4.0) out.push('你要的酸爽它有。');
  if(u.sweet >= 3.5 && w.sweet >= 3.4) out.push('你想喝甜的，它就是甜的。');
  else if(u.sweet <= 0.9 && w.sweet <= 2.0) out.push('你不吃甜，它几乎不甜。');

/* ---------- 黄历：同一天同一场景结果固定 ---------- */
function seededPick(arr, seed, n){
  var pool = arr.slice(), out = [], s = seed;
  for(var i = 0; i < n && pool.length; i++){
    s = (s * 9301 + 49297) % 233280;
    out.push(pool.splice(Math.floor(s / 233280 * pool.length), 1)[0]);
  }
  return out;
}
function almanacFor(scene){
  var a = ALMANAC[scene] || ALMANAC.friends;
  var seed = TODAY.getFullYear() * 10000 + (TODAY.getMonth() + 1) * 100 + TODAY.getDate();
  for(var i = 0; i < scene.length; i++) seed += scene.charCodeAt(i);
  return {yi: seededPick(a.yi, seed, 3), ji: a.ji, say: a.say};
}

function dateBlockHTML(){
  var l = solarToLunar(TODAY);

  return ''
    + '<div class="almanac">'
    +   '<div class="al-date serif">' + TODAY.getFullYear() + ' 年 ' + (TODAY.getMonth() + 1) + ' 月 ' + TODAY.getDate() + ' 日</div>'
    +   '<div class="al-week">' + WK[TODAY.getDay()] + '</div>'
    +   '<div class="al-lunar">农历 ' + md + ' <span>· ' + gz + '年 · 属' + sx + '</span></div>'
    +   '<div class="yiji" id="yiji"></div>'
    + '</div>';
}
function yijiHTML(scene){

}

/* 红卡右下角的两个二维码：左边是测评链接，右边是我自己的公众号。
   任一缺数据（比如本地 file:// 打开时没有可分享链接）就少画一个，两个都没有就整行不出现 */
function qrRowHTML(){
  var a = hasQR()   ? '<div class="qrtile" data-noclose="1"><img src="' + QR_DATA + '" alt="扫码来测"><span>扫码来测</span></div>' : '';
  var b = hasMyQR() ? '<div class="qrtile" data-noclose="1"><img src="' + MY_QR   + '" alt="扫码关注"><span>扫码关注</span></div>' : '';
  if(!a && !b) return '';
  return '<div class="qrrow">' + a + b + '</div>';
}

/* ---------- 结果浮层的内容（点中某一张推荐后"浮"上来） ---------- */
function resultHTML(){
  var u = buildProfile();
  var soft = isSoft(u);
  var top3 = pickTop(rank(u), u);
  var w0 = top3[selected] ? top3[selected].w : top3[0].w;
  var whys = whyLines(w0, u);
  var avoids = soft ? avoidLinesSoft(u) : avoidLines(u);
  var cup = soft ? '杯' : '瓶';

  var html = dateBlockHTML()
    + '<div class="hero' + (soft ? ' soft' : '') + '">'
    +   '<div class="flag">今天配你的这一' + cup + '</div>'
    +   '<h2 class="serif">' + w0.n + '</h2>'
    +   '<div class="meta">' + metaText(w0) + '</div>'
    +   '<div class="tagrow">';
  plainTags(w0).forEach(function(t){ html += '<span class="tag">' + t + '</span>'; });
  html += '</div>'
    +   '<div class="taste"><span class="lbl">喝起来是什么感觉</span>' + tasteText(w0) + '</div>'
    +   '<ul class="why">';
  whys.forEach(function(x){ html += '<li>' + x + '</li>'; });
  html += '</ul>'
    +   '<div class="taste" style="margin-top:20px"><span class="lbl">它具体的味道</span>' + w0.kw.join('，') + '。</div>'
    +   qrRowHTML()
    + '</div>';

  // 「尽量不要选这些」紧跟主推卡：看完推荐，这是最该先知道的一条判断
  html += '<div class="block"><h3>' + (soft ? '这几类先别急着点' : '尽量不要选这些') + '</h3><div class="warn"><ul>';
  avoids.forEach(function(x){ html += '<li>' + x + '</li>'; });
  html += '</ul></div></div>';

  html += '<div class="footer">'
    + (soft
        ? '这一条线给到的都是不含酒精的饮品，不涉及品牌与具体产品；未满 18 岁请勿饮酒。'
        : '本测评只给到「产区 + 风格」这一层，不涉及酒庄、年份与具体酒款。同一个产区里价格差别可能很大，预算只是风格档位上的匹配，不代表某一瓶的具体价钱。')
    + '</div>';

  html += '<div class="ovl-hint">轻点卡片<b>回到三个推荐</b> · 长按卡片<b>把这瓶存成图片</b></div>';
  return html;
}

/* ===================== 渲染 ===================== */
function render(){
  var html = '';
  // 选定结果之后，"三个推荐"那一页仍然留在底下，结果作为浮层盖在上面。
  // 所以这里单独算一个 vis：表示"底下那一页显示到哪一步"。
  var isResult = (step === STEP_RESULT);
  var vis = isResult ? STEP_PICK : step;

  bar.style.width = (isResult ? 100
    : (vis === 0 ? 0 : Math.min(100, vis / (NQ + 1) * 100))) + '%';

  if(vis === 0){
    html = ''
      + '<div class="fade">'
      + '<h1 class="serif">不懂酒没关系，<br><em>来测测你就知道</em></h1>'
      + '<button class="go" id="start">开始</button>'
      + '</div>';
  } else if(vis >= 1 && vis <= NQ){
    var qi = vis - 1;
    var q = QUESTIONS[qi];
    // 前面已经明确说了"0 酒精"，就把带软饮变体的那一题换掉
    var shown = (q.soft && abvChoice() === 'none') ? q.soft : q;
    var opts = shownOpts(qi);
    var multi = !!q.multi;
    var picked = multi ? (Array.isArray(answers[qi]) ? answers[qi] : []) : [];
    html = '<div class="fade">'
      + '<div class="qnum">第 <b>' + step + '</b> / ' + NQ + ' 题</div>'
      + '<div class="qtitle serif">' + shown.t + '</div>'
      + (shown.h ? '<div class="qhint">' + shown.h + '</div>' : '')
      + (multi ? '<div class="qhint multi">'
          + (q.mh || '可以多选。想要两三种都点上；一个都不点，就是让我帮你定。') + '</div>' : '')
      + '<div class="opts' + (multi ? ' multi' : '') + '">';
    opts.forEach(function(o, i){
      html += '<div class="opt' + (picked.indexOf(i) >= 0 ? ' sel' : '') + '" data-i="' + i + '">'
            +   '<div class="dot"></div>'
            +   '<div><div class="olabel">' + o.l + '</div>'
            +   (o.d ? '<div class="odesc">' + o.d + '</div>' : '')
            +   '</div></div>';
    });
    html += '</div>';
    if(multi){
      html += '<div class="multibar"><button class="go" id="mnext">'
            +   multiLabel(picked.length) + '</button></div>';
    }
    html += (step > 1 ? '<div class="back" id="back">← 上一题</div>' : '')
      + '</div>';
  } else if(vis === STEP_PICK){
    var pu = buildProfile();
    var softLine = isSoft(pu);
    var picks = pickTop(rank(pu), pu);
    html = '<div class="fade">'
      + '<div class="rhead serif">给你挑了三个方向</div>'
      + '<p class="picknote">' + (softLine
          ? '这三个都不含酒精，也都配得上你这次的场合。点一下你最想喝的那杯，看看今天的宜忌。'
          : '三个都配得上你这次的场合。点一下你最想开的那瓶，看看今天的宜忌。') + '</p>';
    picks.forEach(function(x, i){
      var w = x.w;
      html += '<div class="card' + (i === 0 ? ' best' : '') + '" data-pick="' + i + '">'
            +   (i === 0 ? '<span class="badge">最贴合你的</span>' : '')
            +   '<h3 class="serif">' + w.n + '</h3>'
            +   '<div class="meta">' + metaText(w) + '</div>'
            +   '<div class="tagrow">';
      plainTags(w).forEach(function(t){ html += '<span class="tag">' + t + '</span>'; });
      html += '</div>'
            +   '<div class="desc">' + tasteText(w) + '</div>'
            +   '<div class="kw">典型味道：' + w.kw.join('，') + '。</div>'
            +   '<div class="wholine">' + whyLines(w, pu).slice(0, 2).join('') + '</div>'
            +   '<div class="pick">' + (softLine ? '就选这一杯 →' : '就选这一瓶 →') + '</div>'
            + '</div>';
    });
    html += '<div class="again"><button class="ghost" id="again">再测一次</button></div>'
          + '<div class="backwrap"><span class="back" id="back">← 想改前面的答案</span></div>'
      + '</div>';
  }

  view.innerHTML = html;

  // ---- 结果浮层：盖在"三个推荐"上面，底下那一页保持原样 ----
  if(isResult){
    ovlBox.innerHTML = '<div class="ovl-bg"></div>'
      + '<div class="ovl-panel">' + resultHTML() + '</div>';
    ovlBox.className = 'ovl on';
  } else {
    ovlBox.className = 'ovl';
    ovlBox.innerHTML = '';
  }

  // 渲染完成后的短暂防误触窗口：手机上"点击穿透"/连点会让下一下落到新页面的按钮上
  lockUntil = Date.now() + 280;

  var yj = document.getElementById('yiji');
  if(yj) yj.innerHTML = yijiHTML(buildProfile().scene);

  var el0 = view.querySelector('.fade');
  if(el0){
    // 先把刚插进来的元素按初始态算一次样式（opacity:0 / 位移），再挂上 in，
    // 过渡才有起点。
    // 这里故意不用 requestAnimationFrame：无头浏览器、切到后台的标签页会节流甚至
    // 完全不触发 rAF，一旦不触发，整页会永远停在 opacity:0 上，等于白屏。
    void el0.offsetHeight;
    el0.classList.add('in');
  }
  bind();
  // 浮层是固定定位、不随页面滚动，所以选定结果时不需要回到顶部；
  // 只有普通翻页才滚回顶部。平滑滚动会在浮层升起时抢视线，也是不加它的原因。
  if(!isResult) window.scrollTo({top:0, behavior:'smooth'});
}

/* ===================== 分享链接与二维码 ===================== */

function onQRReady(fn){
  var pending = [];
  if(hasQR() && !qrReady() && QR_IMG) pending.push(QR_IMG);
  if(hasMyQR() && !myQRReady() && MY_QR_IMG) pending.push(MY_QR_IMG);
  if(!pending.length){ fn(); return; }
  var done = false;
  function go(){ if(done) return; done = true; fn(); }
  pending.forEach(function(img){ img.onload = go; img.onerror = go; });
  setTimeout(go, 2000);
}

/* ===================== 转发与复制链接 ===================== */
// 复制链接（给"转发"按钮在老浏览器里的兜底）
function copyShareLink(){
  function ok(){ toast('链接已复制，去粘贴给朋友'); }
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = SHARE_URL;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    var done = false;
    try { done = document.execCommand('copy'); } catch(e) { done = false; }
    document.body.removeChild(ta);
    if(done) ok(); else toast('复制没成功，长按地址栏手动复制');
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(SHARE_URL).then(ok, fallback);
  } else fallback();
}

// 微信内置浏览器不允许网页自己唤起分享面板，只能引导用户去点右上角的「···」
function showWxGuide(){
  var g = document.getElementById('wxg');
  if(!g) return;
  g.className = 'wxg on';
  g.onclick = function(){ g.className = 'wxg'; };
  setTimeout(function(){ if(g.className.indexOf('on') >= 0) g.className = 'wxg'; }, 6000);
}

/* 右上角「转发」按钮：
   ① 支持 Web Share API 的手机浏览器 → 直接弹系统分享面板（可发微信、朋友圈）；
   ② 微信内置浏览器 → 引导去点右上角的「···」；
   ③ 其它（老浏览器/桌面） → 复制链接兜底。 */
function doShare(){
  var url = SHARE_URL || (typeof location !== 'undefined' ? location.href : '');
  if(/MicroMessenger/i.test(navigator.userAgent || '')){ showWxGuide(); return; }
  if(navigator.share){
    try {
      navigator.share({ title: document.title, text: '不懂酒没关系，来测测你就知道', url: url })
        .catch(function(){ copyShareLink(); });   // 调不起来/被拒就落到复制，别让用户觉得"按了没反应"
      return;
    } catch(e) { /* 有的环境同步抛（安全上下文/手势校验），同样落到复制兜底 */ }
  }
  copyShareLink();
}

/* ===================== 长按存图：只画"红卡那一块" ===================== */
function wrapText(ctx, text, maxWidth){
  var lines = [], line = '';
  for(var i = 0; i < text.length; i++){
    var ch = text.charAt(i);
    if(ch === '\n'){ lines.push(line); line = ''; continue; }
    var test = line + ch;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = ch; }
    else line = test;
  }
  if(line) lines.push(line);
  return lines;
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function heroPick(){

function buildHeroCanvas(){

  plainTags(w).forEach(function(t){

    if(rowW && rowW + GAP + tw > CW2 - 88){ tagRows.push(row); row = []; rowW = 0; }

  if(row.length) tagRows.push(row);
  m.font = '28px ' + sans;
  var tasteL = wrapText(m, tasteText(w), CW2 - 88);

  });
  m.font = '28px ' + serif;
  var kwL = wrapText(m, w.kw.join('，') + '。', CW2);
  var yi0 = al.yi[0], jiStr = '忌 ' + al.ji.join(' · ');

  /* ---- 纵向排版（白卡）---- */
  var DIV1 = 300;                                   // 日期区下的分隔线

  var R_TEND = R_TASTE + (tasteL.length - 1) * 48 + 34;
  var redH = R_TEND + 40;
  var RP = 40, RCW = redW0();
  function redW0(){ return CW2 - RP * 2; }

  var whyTop = redTop + redH + 48;
  var whyY = whyTop;
  whyL.forEach(function(ls){ whyY += 50 + (ls.length - 1) * 44; });
  var kwTop = whyY + 38;

  cv.height = H * dpr;

  ctx.scale(dpr, dpr);

  }
  function center(t, cx, yy, size, font, color, bold){
    ctx.font = (bold ? '600 ' : '') + size + 'px ' + font;
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.fillText(t, cx, yy);
    ctx.textAlign = 'left';
  }
  function right(t, x, yy, size, font, color){
    ctx.font = size + 'px ' + font;
    ctx.fillStyle = color;
    ctx.textAlign = 'right';
    ctx.fillText(t, x, yy);
    ctx.textAlign = 'left';
  }
  function spaced(t, x, yy, size, font, color, ls){
    ctx.font = size + 'px ' + font;
    ctx.fillStyle = color;
    for(var i = 0; i < t.length; i++){
      ctx.fillText(t.charAt(i), x, yy);
      x += ctx.measureText(t.charAt(i)).width + ls;
    }
    return x;
  }
  function hline(x, yy, w2, color){
    ctx.fillStyle = color; ctx.fillRect(x, yy, w2, 1);
  }

  /* ---- 白卡 ---- */
  roundRect(ctx, X, CT, WD, cardBot - CT, 10);
  ctx.fillStyle = '#FFFFFF'; ctx.fill();

  /* 日期区：左大日期，右星期/农历/干支 */
  spaced(monthEn, CX2, CT + 92, 30, serif, INK, 7);
  text(String(TODAY.getDate()), CX2 - 6, CT + 252, 150, serif, INK);
  right(WK[TODAY.getDay()], RX, CT + 118, 26, sans, GRAY);
  right(lunarStr, RX, CT + 156, 24, sans, GRAY);
  right(gzStr, RX, CT + 192, 24, sans, GRAY);
  hline(CX2, CT + DIV1, CW2, '#E7E0D6');

  /* 「宜××」大标题 + 「忌××」小字 */
  ctx.font = '600 60px ' + serif;
  var w1 = ctx.measureText('宜').width;
  ctx.font = '600 60px ' + serif;
  var w2 = ctx.measureText(yi0).width;
  var hx = X + (WD - (w1 + w2 + 10)) / 2;
  text('宜', hx, CT + HDTXT, 60, serif, '#A5384A', true);
  text(yi0, hx + w1 + 10, CT + HDTXT, 60, serif, INK, true);
  center(jiStr, X + WD / 2, CT + JIY, 24, sans, GRAY);

  /* 红色酒卡 */
  roundRect(ctx, CX2, redTop, CW2, redH, 16);
  var bg = ctx.createLinearGradient(0, redTop, 0, redTop + redH);
  bg.addColorStop(0, '#7B2430');
  bg.addColorStop(1, '#43111C');
  ctx.fillStyle = bg; ctx.fill();

  var rx0 = CX2 + RP, rcw = RCW;
  var flagT = '今天配你的这一' + (w.soft ? '杯' : '瓶');
  ctx.font = '22px ' + sans;
  var fw = ctx.measureText(flagT).width + 40;
  roundRect(ctx, rx0, redTop + 56, fw, 48, 24);
  ctx.strokeStyle = 'rgba(233,201,168,.65)'; ctx.lineWidth = 1.5; ctx.stroke();
  center(flagT, rx0 + fw / 2, redTop + 56 + 31, 22, sans, '#E9C9A8');

  text(w.n, rx0, redTop + R_NAME, 54, serif, '#FFFFFF', true);
  metaL.forEach(function(t, i){ text(t, rx0, redTop + R_META + i * 38, 26, sans, 'rgba(255,255,255,.75)'); });

  tagRows.forEach(function(r2, ri){
    var x = rx0;
    r2.forEach(function(o){
      roundRect(ctx, x, redTop + R_PILL + ri * 60, o.w, 46, 23);
      ctx.fillStyle = 'rgba(255,255,255,.14)';
      ctx.fill();
      text(o.t, x + 20, redTop + R_PILL + ri * 60 + 30, 24, sans, '#F6E7D8');
      x += o.w + GAP;
    });
  });

  hline(rx0, redTop + R_TAGS + 24, rcw, 'rgba(255,255,255,.18)');
  text('喝起来是什么感觉', rx0, redTop + R_TLBL, 20, sans, '#E9C9A8');
  tasteL.forEach(function(t, i){ text(t, rx0, redTop + R_TASTE + i * 48, 28, sans, 'rgba(255,255,255,.94)'); });

  /* 推荐理由（白卡上，仿引文排版） */
  var yw = whyTop;
  whyL.forEach(function(ls){
    ls.forEach(function(t, i){ text(t, CX2 + (i ? 18 : 0), yw + i * 44, 26, sans, '#4A3A30'); });
    yw += 50 + (ls.length - 1) * 44;
  });

  /* 一句话味道（衬线引文） */
  kwL.forEach(function(t, i){ text(t, CX2, kwTop + i * 46, 28, serif, '#6B5B4F'); });

  /* 卡内页脚 */
  text('《今天喝什么》· 12 个问题帮你挑一杯', CX2, footBase, 20, sans, '#A79A8B');

  /* ---- 卡外：品牌 + slogan + 两枚二维码 ---- */
  text('今天喝什么', CX2, bTop + 64, 36, serif, INK, true);
  text('不懂酒没关系，来测测你就知道', CX2, bTop + 108, 24, sans, GRAY);

  var tiles = [];
  if(qrReady())   tiles.push({ img: QR_IMG,    cap: '扫码来测' });
  if(myQRReady()) tiles.push({ img: MY_QR_IMG, cap: '扫码关注' });
  if(tiles.length){
    var qx = RX - tiles.length * QT - (tiles.length - 1) * 14;
    tiles.forEach(function(t, i){
      var x = qx + i * (QT + 14);
      roundRect(ctx, x, qy, QT, QT, 10);
      ctx.fillStyle = '#FFFFFF'; ctx.fill();
      try { ctx.drawImage(t.img, x + 9, qy + 9, QT - 18, QT - 18); } catch(e) {}
      center(t.cap, x + QT / 2, qy + QT + 34, 18, sans, GRAY);
    });
  }

  return cv;
}

/* ===================== 存图：一条对多终端都尽量成立的路径 =====================
   难点在于各家对"网页把图存到手机"的支持天差地别：
     · 微信内置浏览器：既禁止网页下载，也没有带文件的系统分享 → 只剩长按图片
     · iOS Safari：<a download> 经常毫无反应 → 得走系统分享面板里的「存储图像」
     · 安卓 Chrome / Edge：<a download> + Blob 最稳
     · 一部分国产浏览器／老旧 webview：<a download> 被阉割 → 退回长按
   所以按环境排优先级，每一层失败都要有明确落点，不能让用户对着没反应的按钮发呆。 */
var POSTER_BLOB = null, POSTER_URL = null;

function posterFileName(){
  var p = function(n){ return ('0' + n).slice(-2); };
  return 'today-drink-' + TODAY.getFullYear() + p(TODAY.getMonth() + 1) + p(TODAY.getDate()) + '.png';
}
function isIOS(){
  return /iP(hone|ad|od)/.test(navigator.userAgent || '')
      || (navigator.platform === 'MacIntel' && (navigator.maxTouchPoints || 0) > 1);
}
/* 同步把预览图转成 Blob 并缓存：三个按钮共用一份，别每次重算那八十万个字节。
   必须是同步的——navigator.share 依赖"此刻还在用户手势里"，中间插一次异步就把手势丢了。 */
function posterBlob(){
  if(POSTER_BLOB) return POSTER_BLOB;
  var im = document.getElementById('pvlimg');
  if(!im || !im.src || im.src.indexOf('data:image') !== 0) return null;
  try{
    var ps = im.src.split(',');
    var mime = (ps[0].match(/:(.*?);/) || [null, 'image/png'])[1];
    var bin = atob(ps[1]), arr = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    POSTER_BLOB = new Blob([arr], { type: mime });
  }catch(e){ POSTER_BLOB = null; }
  return POSTER_BLOB;
}
function posterFile(){
  var b = posterBlob();
  if(!b || typeof File !== 'function') return null;
  try{ return new File([b], posterFileName(), { type: b.type }); }catch(e){ return null; }
}
function downloadPNG(){
  var blob = posterBlob();
  if(!blob) return false;
  try{
    if(POSTER_URL) URL.revokeObjectURL(POSTER_URL);
    POSTER_URL = URL.createObjectURL(blob);   // Blob URL 比超长 data URI 在 webview 里成功率高
  }catch(e){ return false; }
  var a = document.createElement('a');
  a.href = POSTER_URL;
  a.download = posterFileName();
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  // ⚠️ 不能点完立刻 remove：Firefox 是在 click 之后才异步接管下载的，立刻删会把下载掐断
  setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 1500);
  return true;
}
/* 系统分享面板：iOS 的「存储图像」、安卓各家 ROM 的「保存」都藏在这一层里 */
function sharePosterFile(text){
  var f = posterFile();
  if(!f || !navigator.canShare || !navigator.canShare({ files: [f] })) return false;
  navigator.share({ files: [f], title: '今天喝什么', text: text || '' }).catch(function(e){
    // 用户主动取消不算失败，别追着再弹一次下载
    if(!e || e.name !== 'AbortError') guideSave('自动保存没成功，长按这张图存下来吧');
  });
  return true;
}
/* 兜底：把预览层留在屏幕上教用户长按——这是所有环境都认的最后一条路 */
function guideSave(msg){
  var lay = document.getElementById('pvl'), tip = document.getElementById('pvltip');
  if(lay) lay.className = 'pvl on';
  if(tip){ tip.textContent = msg; tip.className = 'pvl-tip on'; }
  toast(msg);
}
function clearSaveTip(){
  var tip = document.getElementById('pvltip');
  if(tip){ tip.className = 'pvl-tip'; tip.textContent = ''; }
}
/* 保存 / 存了再发朋友圈共用这条：先验环境，再按顺序试，最后退到长按 */
function savePosterLocal(okMsg, guideMsg){
  clearSaveTip();   // 先把上一次留下的提示清掉，免得这次明明存成功了还挂着旧话
  if(inWx()){ guideSave(guideMsg.wx); return; }
  if(!posterBlob()){ toast('图片还没准备好，重开一次预览试试'); return; }
  var order = isIOS() ? ['share', 'anchor'] : ['anchor', 'share'];
  for(var i = 0; i < order.length; i++){
    if(order[i] === 'share' && sharePosterFile('')) return;
    if(order[i] === 'anchor' && downloadPNG()){ toast(okMsg); return; }
  }
  guideSave(guideMsg.def);
}
function inWx(){ return /MicroMessenger/i.test(navigator.userAgent || ''); }

/* 预览层下面那排三个按钮：微信 / 朋友圈 / 保存。 */
function sharePosterToWx(){
  clearSaveTip();
  if(inWx()){ toast('长按图片保存到相册，再发给朋友'); return; }
  if(!posterBlob()){ toast('图片还没准备好，重开一次预览试试'); return; }
  if(sharePosterFile('不懂酒没关系，来测测你就知道')) return;
  if(downloadPNG()){ toast('已存到手机，去微信里把这张图发出去'); return; }
  guideSave('没能直接发给微信，长按这张图先存下来');
}
function posterToMoments(){
  savePosterLocal('存好了；发朋友圈时从相册选这张图',
    { wx: '长按图片保存到相册，朋友圈里从相册选图发布',
      def: '长按这张图保存到相册，朋友圈里从相册选它发布' });
}
function savePoster(){
  savePosterLocal('已开始保存；没弹保存框的话，长按这张图也能存',
    { wx: '微信里网页不能直接下载：长按这张图 → 保存图片',
      def: '长按这张图 → 保存图片' });
}

/* 长按红卡＝把"黄历+红卡"长图画出来，弹全屏预览层。
   预览图上不做任何手势拦截：长按它走系统"保存图片"菜单；
   保存/转发也可以点下面那排按钮。 */
function paintHeroImage(){
  onQRReady(function(){
    var url = buildHeroCanvas().toDataURL('image/png');
    var lay = document.getElementById('pvl'), im = document.getElementById('pvlimg');
    if(!lay || !im) return;
    // 换了新海报，之前缓存的 Blob 就作废了；旧 URL 延后回收，免得掐掉还在进行中的下载
    POSTER_BLOB = null;
    if(POSTER_URL){ var oldu = POSTER_URL; POSTER_URL = null;
                    setTimeout(function(){ try{ URL.revokeObjectURL(oldu); }catch(e){} }, 5000); }
    im.src = url;
    clearSaveTip();
    lay.className = 'pvl on';
    lay.onclick = function(){ lay.className = 'pvl'; clearSaveTip(); };   // 轻点任意处关闭（长按不会触发 click）
    var b1 = document.getElementById('pvlwx'),
        b2 = document.getElementById('pvlpyq'),
        b3 = document.getElementById('pvlsave');
    /* 二次确认：每个动作都先给「确认 / 取消」的选择权，确认了才执行 */
    var cfm   = document.getElementById('pvlcfm'),
        cfmT  = document.getElementById('pvlcfmt'),
        cfmOk = document.getElementById('pvlcok'),
        cfmNo = document.getElementById('pvlcno'),
        todo  = null;
    function ask(msg, fn){
      if(!cfm || !cfmOk){ fn(); return; }   // 结构缺失时退化为直接执行
      cfmT.textContent = msg;
      todo = fn;
      cfm.className = 'pvl-cfm on';
    }
    function closeCfm(){ if(cfm) cfm.className = 'pvl-cfm'; todo = null; }
    if(cfm){
      cfm.onclick = function(e){ e.stopPropagation(); closeCfm(); };          // 点空白处＝取消
      var cfmI = cfm.querySelector('.pvl-cfm-i');
      if(cfmI) cfmI.onclick = function(e){ e.stopPropagation(); };            // 点小卡本体不关
    }
    if(cfmOk) cfmOk.onclick = function(e){
      e.stopPropagation();
      closeCfm();
      if(todo){ var fn = todo; todo = null; fn(); }   // 同步执行，保住用户手势（navigator.share 需要）
    };
    if(cfmNo) cfmNo.onclick = function(e){ e.stopPropagation(); closeCfm(); };
    var pcx = document.getElementById('pvlcancel');
    if(pcx) pcx.onclick = function(e){ e.stopPropagation(); lay.className = 'pvl'; clearSaveTip(); };
    if(b1) b1.onclick = function(e){ e.stopPropagation(); ask('把结果图分享给微信朋友？确认后会弹出系统分享面板，在里面选「微信」再选好友。', sharePosterToWx); };
    if(b2) b2.onclick = function(e){ e.stopPropagation(); ask('朋友圈只能由你手动发：确认后先把图存到手机，再打开微信 → 朋友圈 → 右上角相机 → 从相册选这张图。', posterToMoments); };
    if(b3) b3.onclick = function(e){ e.stopPropagation(); ask('把结果图存到手机？安卓一般进「下载」目录；iPhone 会先弹系统面板让你选「存储图像」；微信里请长按这张图保存。', savePoster); };
  });
}
function longPressSave(){ paintHeroImage(); }

/* 回到底下那一页（"三个推荐"）。点结果卡片、点生成的图片，走的都是这里 */
function closeResult(){
  if(blocked()) return;
  step = STEP_PICK;
  render();
}

// 一句轻提示：长按存图有没有成功，得给个回音
function toast(msg){
  if(typeof document === 'undefined' || !document.body) return;
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.classList.add('out'); }, 2200);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2700);
}


function blocked(){ return Date.now() < lockUntil; }

function bind(){
  var s = document.getElementById('start');
  if(s) s.onclick = function(){ if(blocked()) return; step = 1; answers = []; selected = 0; render(); };

  Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(el){
    el.onclick = function(){
      if(el.dataset.done || blocked()) return;
      var qi = step - 1;
      var q = QUESTIONS[qi];

      // 多选题：点一下就是切换选中，不立刻翻页
      if(q && q.multi){
        var idx = parseInt(el.dataset.i, 10);
        var arr = Array.isArray(answers[qi]) ? answers[qi].slice() : [];
        var pos = arr.indexOf(idx);
        if(pos >= 0) arr.splice(pos, 1);                      // 再点一次＝取消
        else if(isAnyOpt(qi, idx)) arr = [idx];               // 点「都行」＝只要它，清掉其它
        else {
          arr = arr.filter(function(k){ return !isAnyOpt(qi, k); }); // 选了具体项就取消「都行」
          arr.push(idx);
        }
        answers[qi] = arr;
        // 只改选中态和按钮字，不整页重绘——重绘会刷新防误触锁，连点会卡
        Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(x){
          var k = parseInt(x.dataset.i, 10);
          if(arr.indexOf(k) >= 0) x.classList.add('sel'); else x.classList.remove('sel');
        });
        var mn0 = document.getElementById('mnext');
        if(mn0) mn0.textContent = multiLabel(arr.length);
        return;
      }

      // 单选题：选中后短暂停顿再翻页
      el.dataset.done = '1';
      answers[qi] = parseInt(el.dataset.i, 10);
      el.classList.add('sel');
      Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(x){ x.style.pointerEvents = 'none'; });
      setTimeout(function(){
        step = (step === NQ) ? STEP_PICK : step + 1;
        render();
      }, 260);
    };
  });

  // 多选题的确认键
  var mn = document.getElementById('mnext');
  if(mn) mn.onclick = function(){
    if(blocked()) return;
    var qi = step - 1;
    if(!Array.isArray(answers[qi])) answers[qi] = [];
    step = (step === NQ) ? STEP_PICK : step + 1;
    render();
  };

  // 三个候选卡：整张卡片可点，点中哪张就定哪瓶
  Array.prototype.forEach.call(view.querySelectorAll('.card[data-pick]'), function(el){
    el.onclick = function(){
      if(el.dataset.done || blocked()) return;
      el.dataset.done = '1';
      selected = parseInt(el.dataset.pick, 10);
      step = STEP_RESULT;
      render();
    };
  });

  // ---- 结果浮层：轻点红卡＝回到三个推荐；点背景也返回；右下角两枚二维码不参与 ----
  if(ovlBox && ovlBox.className.indexOf('on') >= 0){
    var bg = ovlBox.querySelector('.ovl-bg');
    if(bg) bg.onclick = function(){ closeResult(); };

    var hero = ovlBox.querySelector('.hero');
    if(hero){
      // 落在二维码上的手势要让给系统（长按识别 / 保存图片），不能当成"轻点返回"
      function onQRNode(el){
        while(el && el !== hero){
          if(el.dataset && el.dataset.noclose) return true;
          el = el.parentNode;
        }
        return false;
      }
      var hQR = false, hmoved = false, ht0 = 0, hstart = null;
      hero.addEventListener('touchstart', function(e){
        hQR = onQRNode(e.target); hmoved = false; ht0 = Date.now();
        hstart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }, {passive:true});
      // 手指按住不动也常有 1-2px 的抖动会触发 touchmove；位移超过 12px 才算滑动，
      // 否则长按永远被当成滑动取消——这就是"长按没反应"的主因
      hero.addEventListener('touchmove', function(e){
        if(!hstart) return;
        var dx = e.touches[0].clientX - hstart.x, dy = e.touches[0].clientY - hstart.y;
        if(dx * dx + dy * dy > 144) hmoved = true;
      }, {passive:true});
      hero.addEventListener('touchend', function(e){
        if(hQR || hmoved) return;            // 二维码：把手势让给系统（长按识别/保存）
        e.preventDefault();                  // 压掉 touchend 之后那次 ghost click
        if(ht0 && (Date.now() - ht0) > 300){ longPressSave(); return; }  // 长按＝存红卡那块图
        closeResult();                       // 轻点＝返回
      });
      hero.addEventListener('contextmenu', function(e){ if(!hQR) e.preventDefault(); });
      hero.onclick = function(e){            // 桌面端：点一下也返回
        if(hQR || hmoved || onQRNode(e.target)) return;
        e.preventDefault();
        closeResult();
      };
    }
  }

  var b = document.getElementById('back');
  if(b) b.onclick = function(){
    if(blocked()) return;
    if(step > 1){ step--; answers.length = Math.min(answers.length, step); render(); }
  };

  // 右上角「转发」按钮：全程常驻，随时能把链接发到群里或朋友圈
  var fb = document.getElementById('fab');
  if(fb) fb.onclick = function(){ if(blocked()) return; doShare(); };

  var a = document.getElementById('again');
  if(a) a.onclick = function(){ if(blocked()) return; step = 0; answers = []; selected = 0; render(); };
}

/* 手机"点击穿透"防护：touchstart 和随后那次 click 的落点如果不是同一处，
   说明中间页面重绘过，这次 click 直接吞掉，避免误触到新页面的按钮。
   （typeof 判断是为了让这段代码在无 DOM 的校验环境里也能被安全加载） */
if(typeof document !== 'undefined' && document.addEventListener){
  (function(){
    var touchTarget = null;
    document.addEventListener('touchstart', function(e){ touchTarget = e.target; }, true);
    document.addEventListener('click', function(e){
      if(touchTarget && !touchTarget.contains(e.target) && !e.target.contains(touchTarget)){
        e.stopPropagation();
        e.preventDefault();
      }
      touchTarget = null;
    }, true);
  })();
}

render();
</script>
